name: Verify actions lockfile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false

      # gh can't pin a binary extension to a commit, so pin only immutable releases, whose tag and binaries GitHub locks.
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify actions.lock
        run: gh actions-lock --verify
