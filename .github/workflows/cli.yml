name: Unit Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "qlty-*/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "qlty-*/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".github/workflows/cli.yml"

permissions:
  actions: write
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true

    steps:
      - run: git config --global core.autocrlf false

      - name: Checkout qlty
        uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.56.23
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.8.0

      - name: Run Test
        run: cargo llvm-cov --lcov --output-path target/lcov.info -- --include-ignored

      - uses: qltysh/qlty-action/coverage@v2.2.2
        if: ${{ matrix.os != 'windows-2022' }}
        with:
          oidc: true
          files: target/lcov.info
          tag: ${{ matrix.os }}
          skip-errors: false
