name: Fmt

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    environment: qlty-releases
    steps:
      - uses: actions/create-github-app-token@v2.1.4
        id: app-token
        with:
          app-id: ${{ vars.QLTY_APP_ID }}
          private-key: ${{ secrets.QLTY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: qlty
          permission-contents: write
          permission-pull-requests: write
      - name: Check the token reaches one repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test "$(gh api /installation/repositories --jq .total_count)" = 1
      - uses: actions/checkout@v5.0.0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: qltysh/qlty-action/fmt@v2.2.2
      - name: Commit changes
        uses: peter-evans/create-pull-request@v7.0.8
        with:
          token: ${{ steps.app-token.outputs.token }}
          title: qlty fmt --all
          body: Automated PR for qlty fmt --all
          labels: chore
          branch: fmt
          delete-branch: true
          sign-commits: true
          commit-message: qlty fmt --all
          committer: qltysh[bot] <168846912+qltysh[bot]@users.noreply.github.com>
          author: qltysh[bot] <168846912+qltysh[bot]@users.noreply.github.com>
