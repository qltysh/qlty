name: Plugin Tests
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 5"
  push:
    branches:
      - main
    paths:
      - "qlty-plugins/**"
      - "qlty-config/**"
      - "qlty-check/src/tool/**"
      - ".github/workflows/plugins.yml"
      - "qlty-cli/src/commands/plugins/enable.rs"
      - "qlty-cli/src/initializer/scanner.rs"
      - "qlty-cli/src/initializer/scanner/**"
  pull_request:
    paths:
      - "qlty-plugins/**"
      - "qlty-config/**"
      - "qlty-check/src/tool/**"
      - ".github/workflows/plugins.yml"
      - "qlty-cli/src/commands/plugins/enable.rs"
      - "qlty-cli/src/initializer/scanner.rs"
      - "qlty-cli/src/initializer/scanner/**"

permissions:
  actions: write
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-2022]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    env:
      QLTY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v5.0.0
        with:
          cache: "npm"
          cache-dependency-path: plugins/package-lock.json

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@2.40.0
        if: contains(matrix.os, 'macos')

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.257.0
        with:
          ruby-version: 3.3.7
        if: contains(matrix.os, 'windows')

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.0
        with:
          # The toolchain action runs its own rust-cache restore with the
          # default key; the Cache Rust step below is the only one wanted.
          cache: false

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.8.0
        with:
          # The cli workflow's job is also named "test" and builds under
          # cargo llvm-cov, so without this both jobs share one cache entry.
          key: plugins

      - name: cargo build
        run: cargo build
        env:
          RUST_BACKTRACE: 1

      - name: Move qlty into PATH
        run: echo "${{ github.workspace }}/target/debug" >> $GITHUB_PATH

      - name: Check qlty version
        run: qlty --version

      - name: Run plugins tests
        working-directory: plugins
        run: |
          npm ci --ignore-scripts
          npm test
