<aside id="annotation-tooltip" class="annotation-tooltip" popover="manual" role="tooltip"></aside>
<aside id="chart-annotation-popover" class="annotation-popover" popover="auto" role="dialog" aria-labelledby="annotation-title">
  <div class="annotation-heading">
    <div><p id="annotation-period"></p><h2 id="annotation-title"></h2></div>
    <button type="button" class="icon-button" id="annotation-close" aria-label="Close annotation">__ICON_x-mark__<span class="button-target" aria-hidden="true"></span></button>
  </div>
  <p id="annotation-body"></p>
  <button type="button" class="annotation-files" id="annotation-files"><span id="annotation-action-label">View contributing files</span> __ICON_chevron-right__</button>
</aside>
