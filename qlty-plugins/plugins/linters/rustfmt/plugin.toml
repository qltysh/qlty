config_version = "0"

[plugins.definitions.rustfmt]
runtime = "rust"
package = "rustfmt"
file_types = ["rust"]
latest_version = "1.82.0"
known_good_version = "1.82.0"
config_files = ["rustfmt.toml", ".rustfmt.toml"]
affects_cache = ["Cargo.toml", "Cargo.lock"]
description = "Rust code formatter"

[plugins.definitions.rustfmt.drivers.format]
# Without skip_children, rustfmt also formats each `mod foo;` file and fails when
# that file is not in the sandbox. Stable rustfmt only honors it via --config.
#
# Like cargo fmt, pass the edition from each file's nearest Cargo.toml, which
# overrides rustfmt.toml. Without it, rustfmt parses files as Rust 2015.
script = "rustfmt --config skip_children=true ${edition_script} ${target}"
edition_script = "--edition ${edition}"
batch_by = "cargo_edition"
success_codes = [0]
output = "rewrite"
batch = true
driver_type = "formatter"
cache_results = true
suggested = "config"

[[plugins.definitions.rustfmt.environment]]
name = "PATH"
list = ["${runtime}/bin", "${env.PATH}"]