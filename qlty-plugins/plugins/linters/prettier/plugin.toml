config_version = "0"

[plugins.definitions.prettier]
runtime = "node"
package = "prettier"
file_types = [
  "css",
  "graphql",
  "html",
  "javascript",
  "json",
  "markdown",
  "sass",
  "tsx",
  "typescript",
  "yaml",
]
latest_version = "3.6.2"
known_good_version = "3.6.2"
version_command = "prettier --version"
config_files = [
  ".prettierrc.cjs",
  ".prettierrc.js",
  ".prettierrc.json",
  ".prettierrc.json5",
  ".prettierrc.toml",
  ".prettierrc.yaml",
  ".prettierrc.yml",
  ".prettierrc",
  "prettier.config.cjs",
  "prettier.config.js",
]
affects_cache = ["package.json", ".editorconfig", ".prettierignore"]
description = "JS, CSS, HTML, JSON, TS, GraphQL, MD and YML formatter"
package_file_candidate = "package.json"
package_file_candidate_filters = ["prettier"]

[plugins.definitions.prettier.drivers.format]
script = "prettier --config ${config_file} -w ${target}"
# Prettier reads .prettierignore only from its working directory, so it has to
# run from the staging root like the other formatters. It also resolves plugins
# named in its config from the working directory with ES module rules, which
# ignore NODE_PATH, so the prepare script links the tool install's node_modules
# into the staging root first. Node creates a junction on Windows, which needs
# no privilege, and a symlink elsewhere. Covered by fixtures/plugin.in and
# fixtures/ignore.in.
runs_from = { type = "root" }
prepare_script = "node -e \"const fs=require('fs');fs.existsSync('node_modules')||fs.symlinkSync(process.argv[1],'node_modules','junction')\" \"${linter}/node_modules\""
batch_by = "config_file"
success_codes = [0] # https://prettier.io/docs/cli#exit-codes
cache_results = true
output = "rewrite"
batch = true
driver_type = "formatter"
suggested = "config"
