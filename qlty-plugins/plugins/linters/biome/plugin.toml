config_version = "0"

[plugins.definitions.biome]
runtime = "node"
package = "@biomejs/biome"
file_types = ["typescript", "javascript", "jsx", "tsx", "json", "css"]
config_files = ["biome.json", "biome.jsonc"]
affects_cache = ["package.json", ".editorconfig"]
latest_version = "2.5.6"
known_good_version = "2.5.6"
version_command = "biome --version"
description = "A static analyzer for web projects"
package_file_candidate = "package.json"
package_file_candidate_filters = ["biome"]

# Biome 1.x reads one config per run and doesn't fail on nested ones, so it
# keeps running from the root as before.
# The first matching entry wins, so this one must stay before "<2.4.0".
[[plugins.definitions.biome.drivers.lint.version]]
version_matcher = "<2.0.0"
script = "biome lint --reporter=json ${target}"
success_codes = [0, 1]
output = "stdout"
output_format = "biome"
batch = true
cache_results = true
suggested = "config"
output_missing = "parse"

# Biome's unstable `json` reporter changed shape in 2.4.0; the stable
# `rdjson` reporter (added in 2.x) also carries fix data, which `json`
# dropped in 2.4.0.
[[plugins.definitions.biome.drivers.lint.version]]
version_matcher = "<2.4.0"
script = "biome lint --reporter=json ${target}"
success_codes = [0, 1]
output = "stdout"
output_format = "biome"
batch = true
cache_results = true
suggested = "config"
output_missing = "parse"
runs_from = { type = "root_or_outermost_config" }
batch_by = "invocation_directory"

[[plugins.definitions.biome.drivers.lint.version]]
version_matcher = ">=2.4.0"
script = "biome lint --reporter=rdjson ${target}"
success_codes = [0, 1]
output = "stdout"
output_format = "rdjson"
batch = true
cache_results = true
suggested = "config"
output_missing = "parse"
runs_from = { type = "root_or_outermost_config" }
batch_by = "invocation_directory"

[plugins.definitions.biome.drivers.format]
script = "biome format --write ${target}"
success_codes = [0, 1]
output = "rewrite"
batch = true
cache_results = true
driver_type = "formatter"
suggested = "config"
